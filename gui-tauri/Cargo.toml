[package]
name = "rufux-gui"
version = "2.0.0"
edition = "2021"
description = "Rufux front end: a 1:1 Rufus dialog replica (Tauri + WebView) driving the rufux CLI backend"

[build-dependencies]
tauri-build = "2"

[dependencies]
tauri = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "rt", "rt-multi-thread", "macros"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
