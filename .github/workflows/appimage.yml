name: appimage

# Builds the portable AppImage and attaches it to the published release.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake gcc pkg-config file wget \
            ninja-build libxkbcommon-dev libwayland-dev libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 \
            libegl1 libgl1 libudev-dev libblkid-dev libssl-dev gettext curl \
            util-linux dosfstools exfatprogs e2fsprogs mtools ntfs-3g \
            syslinux libarchive-tools p7zip-full xorriso udisks2 \
            wimtools libhivex-bin gawk genisoimage python3 xvfb \
            parted udftools libgtk-4-dev patchelf librsvg2-dev \
            smartmontools qemu-utils grub-pc-bin grub-common sbsigntool openssl \
            qemu-system-x86 fdisk

      - name: Configure and build
        # GTK4 follows the desktop's theme and draws its own window
        # decorations natively (through the portal when sandboxed, as in an
        # AppImage) - unlike the previous Qt build, no extra Qt version pin
        # or GNOME decoration plugin is needed here.
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Install into AppDir
        run: DESTDIR="$PWD/AppDir" cmake --install build

      - name: Bundle helper tools
        # Rufux shells out to distro tools instead of linking them in.
        # Ship them inside the AppImage so hosts need nothing installed
        # except the udisks2 daemon (mounts). GRUB's tools ride along too, with
        # its module tree pruned to the ~400 KB Windows BIOS boot uses
        # (packaging/prune-grub.sh). linuxdeploy -e pulls
        # each binary plus its shared libraries; AppDir/usr/bin is on
        # PATH at runtime so rufux_have() finds them with no code
        # changes. syslinux MBR data rides along under
        # AppDir/usr/share/syslinux (boot.c/partition.c resolve it
        # exe-relative); payloads and locales are already installed
        # there by cmake, resolved the same way (wininstall.c, i18n.h).
        # udevadm stays host-side (it is systemd itself, guarded by
        # rufux_have). mtools, gawk, xorriso are unused at runtime.
        run: |
          # Deploy one tool: resolve symlinks (mkfs.vfat -> mkfs.fat),
          # require ELF (wrapper scripts killed two CI runs already),
          # and re-link the name Rufux looks up.
          mkdir -p AppDir/usr/bin
          deploy_tool() {
            name="$1"; shift
            for c in "$@"; do
              case "$c" in
                */*) [ -x "$c" ] && p="$c" || continue ;;
                *) p="$(command -v "$c" 2>/dev/null)" || continue ;;
              esac
              p="$(readlink -f "$p")"
              if [ "$(head -c 4 "$p" | od -An -tx1 | tr -d ' \n')" = "7f454c46" ]; then
                echo "-e $p" >> "$GITHUB_WORKSPACE/.rufux-tools"
                base="$(basename "$p")"
                [ "$base" = "$name" ] || ln -sf "$base" "AppDir/usr/bin/$name"
                echo "$name -> $p"
                return 0
              fi
            done
            echo "no ELF binary for: $name ($*)"; exit 1
          }
          : > "$GITHUB_WORKSPACE/.rufux-tools"
          for t in mkfs.vfat mkfs.ntfs ntfsfix mkfs.exfat mkfs.ext4 mkfs.udf sfdisk partprobe bsdtar wimlib-imagex hivexsh syslinux udisksctl curl; do
            deploy_tool "$t" "$t"
          done
          # 7z is a wrapper script on Debian/Ubuntu (and Arch): deploy
          # the real backend behind it.
          deploy_tool 7z 7zz 7za 7zr /usr/lib/7zip/7z
          # Ubuntu's 7z is a thin binary that loads its archive formats from 7z.so
          # next to it. Without the plugin `7z i` still runs but every archive fails
          # with "Can't open as archive", and this copy shadows the system's 7z.
          [ -f /usr/lib/7zip/7z.so ] && cp /usr/lib/7zip/7z.so AppDir/usr/bin/7z.so
          # 2.0 additions: drive health (SMART), VHDX/VMDK/QCOW2/VDI expansion, and the
          # GRUB tools that give Windows sticks legacy BIOS boot.
          for t in smartctl qemu-img grub-mkimage; do
            deploy_tool "$t" "$t"
          done
          # grub-bios-setup is not on PATH on Debian/Ubuntu; it lives with the modules.
          deploy_tool grub-bios-setup grub-bios-setup /usr/lib/grub/i386-pc/grub-bios-setup /usr/lib/grub2/i386-pc/grub-bios-setup
          packaging/prune-grub.sh /usr/lib/grub/i386-pc AppDir/usr/lib/grub/i386-pc
          mkdir -p AppDir/usr/share/syslinux
          cp /usr/lib/syslinux/mbr/*.bin AppDir/usr/share/syslinux/
          ls AppDir/usr/share/syslinux/

      - name: Fetch linuxdeploy
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          # Unlike linuxdeploy-plugin-qt, the GTK plugin isn't published as a
          # prebuilt AppImage under a release tag - it's a shell script.
          wget -q https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-gtk.sh
          echo "$PWD" >> "$GITHUB_PATH"

      - name: Bundle AppImage
        env:
          # GitHub runners have no FUSE: let linuxdeploy run its plugin AppImage extracted.
          APPIMAGE_EXTRACT_AND_RUN: 1
          # The gtk plugin script needs to know where the core linuxdeploy
          # AppImage is, since it isn't itself an AppImage that could infer it.
          LINUXDEPLOY: ${{ github.workspace }}/linuxdeploy-x86_64.AppImage
        run: |
          # GTK4 draws its own window decorations and reads the desktop's
          # theme through the settings portal automatically, sandboxed or
          # not, so unlike the Qt build this needs no extra decoration
          # plugin and no pinned toolkit version.
          ./linuxdeploy-x86_64.AppImage --appimage-extract-and-run \
            --appdir AppDir \
            -e AppDir/usr/bin/rufux \
            $(tr '\n' ' ' < "$GITHUB_WORKSPACE/.rufux-tools") \
            -d AppDir/usr/share/applications/io.github.hultwl.rufux.desktop \
            -i AppDir/usr/share/icons/hicolor/128x128/apps/io.github.hultwl.rufux.png \
            --plugin gtk \
            --output appimage
          ls -la ./*.AppImage

      - name: Verify the desktop integration is bundled
        run: |
          [ -f AppDir/usr/share/glib-2.0/schemas/gschemas.compiled ] || { echo "missing glib schemas"; exit 1; }
          ls AppDir/usr/lib | grep -c 'libgtk-4' | sed 's/^/GTK4 libraries bundled: /'

      - name: Verify bundled tools
        # Every helper must have landed in AppDir/usr/bin with
        # resolvable libraries, plus the syslinux MBR data.
        run: |
          for t in mkfs.vfat mkfs.ntfs ntfsfix mkfs.exfat mkfs.ext4 mkfs.udf sfdisk partprobe bsdtar 7z wimlib-imagex hivexsh syslinux udisksctl curl smartctl qemu-img grub-mkimage grub-bios-setup; do
            [ -x "AppDir/usr/bin/$t" ] || { echo "not bundled: $t"; exit 1; }
          done
          [ -f AppDir/usr/share/syslinux/mbr.bin ] || { echo "mbr.bin missing"; exit 1; }
          [ -f AppDir/usr/share/syslinux/gptmbr.bin ] || { echo "gptmbr.bin missing"; exit 1; }
          for f in boot.img kernel.img diskboot.img lzma_decompress.img ntfs.mod fat.mod ntldr.mod; do
            [ -f "AppDir/usr/lib/grub/i386-pc/$f" ] || { echo "GRUB file missing: $f"; exit 1; }
          done
          [ -f AppDir/usr/share/rufux/dbx/dbx_x64.efiauth2 ] || { echo "DBX revocation data missing"; exit 1; }
          missing="$(find AppDir/usr/bin AppDir/usr/lib -type f -executable 2>/dev/null | while read -r f; do ldd "$f" 2>/dev/null; done | grep 'not found' || true)"
          [ -z "$missing" ] || { echo "unresolved libraries:$missing"; exit 1; }
          # Presence is not enough (a wrapper script passed this once):
          # execute the key bundled helpers.
          AppDir/usr/bin/7z i >/dev/null || { echo "bundled 7z broken"; exit 1; }
          # ...and it has to really open an ISO (UDF/ISO9660 extraction needs it).
          mkdir -p /tmp/7ztest && echo hello > /tmp/7ztest/f.txt && genisoimage -quiet -o /tmp/7ztest.iso /tmp/7ztest
          AppDir/usr/bin/7z l /tmp/7ztest.iso | grep -q "f.txt" || { echo "bundled 7z cannot open an ISO"; exit 1; }
          for v in "bsdtar --version" "sfdisk --version" "curl --version" "wimlib-imagex --version" "smartctl --version" "qemu-img --version" "grub-mkimage --version"; do
            # shellcheck disable=SC2086
            AppDir/usr/bin/$v >/dev/null || { echo "bundled $v broken"; exit 1; }
          done
          echo "bundled tools OK"

      - name: Smoke test the AppImage
        # Starts the bundled GTK GUI on a virtual X server (the x11 backend real
        # users get) and requires it to draw its window, so a broken GTK bundle
        # fails the release build instead of shipping.
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          RUFUX_GUI_SNAPSHOT: ${{ github.workspace }}/rufux-gui.png
        run: |
          chmod +x ./Rufux-*.AppImage
          xvfb-run -a ./Rufux-*.AppImage --gui
          test -s rufux-gui.png
          ./Rufux-*.AppImage 2>&1 | head -1

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" ./Rufux-*.AppImage --clobber

      - uses: actions/upload-artifact@v7
        with:
          name: Rufux-AppImage
          path: |
            ./Rufux-*.AppImage
            ./rufux-gui.png
