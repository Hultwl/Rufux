name: rufux

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake gcc pkg-config \
            qt6-base-dev libudev-dev libblkid-dev libssl-dev gettext curl \
            util-linux dosfstools exfatprogs e2fsprogs mtools ntfs-3g \
            syslinux libarchive-tools p7zip-full xorriso udisks2 \
            wimtools libhivex-bin gawk genisoimage python3
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Test as root
        # The tests that matter most (partition tables, file systems, boot.wim
        # edits, WIM splitting) need root and loop devices, so as a normal user
        # they only skip. Runners allow both; the udisksctl shim stands in for
        # the desktop's udisks daemon.
        shell: bash
        run: |
          sudo env "PATH=$PWD/tests/shims:$PATH" ctest --test-dir build --output-on-failure | tee ctest-root.log
          # A test that skips itself still counts as a pass; as root nothing may skip.
          if grep -qE 'Skipped|Not Run' ctest-root.log; then
            echo "::error::tests were skipped as root: $(grep -E 'Skipped|Not Run' ctest-root.log | tr -s ' ' | tr '\n' ';')"
            exit 1
          fi
      - name: Package (artifact)
        run: |
          DESTDIR="$PWD/dist" cmake --install build
          tar -czf rufux-ubuntu.tar.gz -C dist .
      - uses: actions/upload-artifact@v7
        with:
          name: rufux-ubuntu
          path: rufux-ubuntu.tar.gz
