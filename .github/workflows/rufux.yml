name: rufux

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake gcc pkg-config \
            qt6-base-dev libudev-dev libblkid-dev libssl-dev gettext curl \
            util-linux dosfstools exfatprogs e2fsprogs mtools ntfs-3g \
            syslinux libarchive-tools p7zip-full xorriso udisks2 \
            wimtools libhivex-bin gawk genisoimage python3
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Package (artifact)
        run: |
          DESTDIR="$PWD/dist" cmake --install build
          tar -czf rufux-ubuntu.tar.gz -C dist .
      - uses: actions/upload-artifact@v4
        with:
          name: rufux-ubuntu
          path: rufux-ubuntu.tar.gz
