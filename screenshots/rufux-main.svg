<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Rufux 1.9 main window</title>
  <desc id="desc">Dark-themed Rufux bootable USB utility window matching the provided mockup.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1225"/>
      <stop offset="30%" stop-color="#0f1d2f"/>
      <stop offset="70%" stop-color="#101a29"/>
      <stop offset="100%" stop-color="#0d1520"/>
    </linearGradient>
    <linearGradient id="header" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141d2d"/>
      <stop offset="100%" stop-color="#0f1724"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2e35"/>
      <stop offset="100%" stop-color="#23282d"/>
    </linearGradient>
    <linearGradient id="btnBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f87c8"/>
      <stop offset="100%" stop-color="#3d6db6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle cx="-40" cy="120" r="300" fill="#233d62" opacity="0.32"/>
  <circle cx="960" cy="-80" r="260" fill="#1a2647" opacity="0.26"/>
  <circle cx="1180" cy="540" r="180" fill="#1f2d50" opacity="0.2"/>

  <rect x="0" y="0" width="1280" height="56" fill="url(#header)"/>
  <text x="640" y="37" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="28" font-weight="600" fill="#f1f5fb">Rufux 1.9</text>

  <g fill="#d9e1ee" font-family="Segoe UI, sans-serif">
    <rect x="1186" y="18" width="18" height="18" rx="3" fill="#5b7ea5" opacity="0.9"/>
    <rect x="1225" y="18" width="18" height="18" rx="3" fill="#4f6d98" opacity="0.9"/>
    <rect x="1262" y="18" width="18" height="18" rx="3" fill="#5f7e9b" opacity="0.9"/>
    <path d="M1212 28h12M1218 22v12" stroke="#dfe5ef" stroke-width="1.3" stroke-linecap="round" opacity="0.85"/>
    <path d="M1278 22l8 8M1286 22l-8 8" stroke="#dfe5ef" stroke-width="1.4" stroke-linecap="round" opacity="0.85"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="86" y="110" width="1108" height="500" rx="10" fill="#2e3138" opacity="0.92"/>
  </g>

  <g font-family="Segoe UI, sans-serif">
    <text x="126" y="160" font-size="22" font-weight="600" fill="#eef2f7">Drive Properties</text>

    <g>
      <text x="150" y="220" font-size="21" fill="#f0f4fa">Device</text>
      <rect x="420" y="190" width="612" height="44" rx="6" fill="#201d1d" stroke="#6a7079" stroke-width="1.4"/>
      <text x="452" y="219" font-size="20" fill="#e8edf5">No USB drive found</text>
      <path d="M1008 206l10 10 10-10M1018 216v8M1008 224l10 10 10-10" stroke="#c6d3e8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

      <text x="150" y="286" font-size="21" fill="#f0f4fa">Boot selection</text>
      <rect x="420" y="255" width="470" height="44" rx="6" fill="#1d211f" stroke="#6a7079" stroke-width="1.4"/>
      <text x="452" y="284" font-size="20" fill="#dfe7f3">Disk or ISO image (Please select)</text>
      <path d="M868 271l10 10 10-10M878 281v8M868 289l10 10 10-10" stroke="#d2dbee" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="924" y="255" width="108" height="44" rx="6" fill="#1d211f" stroke="#6a7079" stroke-width="1.4"/>
      <text x="970" y="284" font-size="18" text-anchor="middle" fill="#dfe7f3" font-weight="600">SELECT</text>

      <text x="150" y="352" font-size="21" fill="#f0f4fa">Partition scheme</text>
      <rect x="420" y="322" width="612" height="44" rx="6" fill="#222424" stroke="#6a7079" stroke-width="1.4"/>
      <text x="452" y="351" font-size="20" fill="#edf3fb">GPT</text>
      <path d="M1008 338l10 10 10-10M1018 348v8M1008 356l10 10 10-10" stroke="#cfe1ff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

      <text x="150" y="418" font-size="21" fill="#f0f4fa">Target system</text>
      <rect x="420" y="388" width="612" height="44" rx="6" fill="#212629" stroke="#6a7079" stroke-width="1.4"/>
      <text x="452" y="417" font-size="20" fill="#edf3fb">UEFI (non CMS)</text>
      <path d="M1008 404l10 10 10-10M1018 414v8M1008 422l10 10 10-10" stroke="#d7e3f5" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <g>
      <line x1="130" y1="470" x2="1115" y2="470" stroke="#4b5057" stroke-width="1" opacity="0.8"/>
      <text x="126" y="520" font-size="22" font-weight="600" fill="#eef2f7">Format Options</text>

      <text x="150" y="574" font-size="21" fill="#f0f4fa">Volume label</text>
      <rect x="420" y="544" width="612" height="44" rx="6" fill="#201d1d" stroke="#6a7079" stroke-width="1.4"/>
      <text x="452" y="573" font-size="20" fill="#edf3fb">NO_LABEL</text>

      <text x="150" y="640" font-size="21" fill="#f0f4fa">File system</text>
      <rect x="420" y="610" width="612" height="44" rx="6" fill="#222424" stroke="#6a7079" stroke-width="1.4"/>
      <text x="452" y="639" font-size="20" fill="#edf3fb">FAT32</text>
      <path d="M1008 626l10 10 10-10M1018 636v8M1008 644l10 10 10-10" stroke="#d7e3f5" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

      <text x="150" y="706" font-size="21" fill="#f0f4fa">Cluster size</text>
      <rect x="420" y="676" width="612" height="44" rx="6" fill="#212629" stroke="#6a7079" stroke-width="1.4"/>
      <text x="452" y="705" font-size="20" fill="#edf3fb">4096 bytes (Default)</text>
      <path d="M1008 692l10 10 10-10M1018 702v8M1008 710l10 10 10-10" stroke="#d7e3f5" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <g>
      <line x1="130" y1="760" x2="1115" y2="760" stroke="#4b5057" stroke-width="1" opacity="0.8"/>
      <text x="126" y="820" font-size="22" font-weight="600" fill="#eef2f7">Status</text>
      <text x="785" y="820" font-size="18" text-anchor="end" fill="#d9e3ef" font-weight="600">READY</text>

      <rect x="130" y="840" width="66" height="42" rx="5" fill="#1d2125" stroke="#7c8290" stroke-width="1.2"/>
      <text x="163" y="869" text-anchor="middle" font-size="26" fill="#dfe5ef">i</text>

      <rect x="210" y="840" width="116" height="42" rx="5" fill="#1d2125" stroke="#7c8290" stroke-width="1.2"/>
      <text x="268" y="869" text-anchor="middle" font-size="20" fill="#e7ecf5" font-weight="600">Log</text>

      <rect x="930" y="834" width="190" height="50" rx="7" fill="url(#btnBlue)"/>
      <text x="1025" y="867" text-anchor="middle" font-size="20" font-weight="700" fill="#f3f6fb">START</text>

      <rect x="1128" y="834" width="76" height="50" rx="7" fill="#1f2227" stroke="#7c8290" stroke-width="1.2"/>
      <text x="1166" y="867" text-anchor="middle" font-size="20" fill="#edf2fa" font-weight="600">CLOSE</text>
    </g>
  </g>

  <text x="130" y="928" font-family="Segoe UI, sans-serif" font-size="15" fill="#dfe7f3">0 devices found</text>
</svg>




















































































































































































































